<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Portrait strip hero — portable verification</title><style>:root {
  color-scheme: light;

  /* Techies Starter Framework: color Primitives and Semantic Roles. */
  --color-primary-lightest: oklch(98.9% 0.003 275.8);
  --color-primary-lighter: oklch(95.4% 0.019 275.5);
  --color-primary-light: oklch(88.3% 0.048 274.7);
  --color-primary: #2563eb;
  --color-primary-dark: oklch(40.4% 0.158 262.9);
  --color-primary-darker: oklch(27.3% 0.107 262.9);
  --color-primary-darkest: oklch(15.3% 0.06 262.9);

  --semantic-primary: var(--color-primary);
  --semantic-action: var(--color-primary);
  --semantic-surface: var(--color-primary-lightest);
  --semantic-text: #111827;
  --semantic-border: var(--color-primary-light);
  --semantic-focus: var(--color-primary);

  /* Techies Starter Framework: typography Primitives. */
  --font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-heading: var(--font-body);
  --font-code: "Roboto Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  --text-xs: 0.7901rem;
  --text-s: 0.8889rem;
  --text-m: 1rem;
  --text-l: 1.5rem;
  --text-xl: 1.999rem;
  --text-2xl: 2.6647rem;
  --text-3xl: 3.552rem;
  --text-4xl: 4.7348rem;

  /* Techies Starter Framework: spacing and radius Primitives. */
  --space-4xs: 0.25rem;
  --space-3xs: 0.5rem;
  --space-2xs: 0.625rem;
  --space-xs: 0.75rem;
  --space-s: 0.875rem;
  --space-m: 1rem;
  --space-l: 1.5rem;
  --space-xl: 2rem;
  --space-2xl: 3rem;
  --space-3xl: 4rem;
  --space-4xl: 6rem;

  --radius-xs: 0.125rem;
  --radius-s: 0.25rem;
  --radius-m: 0.5rem;
  --radius-l: 0.75rem;
  --radius-xl: 1rem;
  --radius-full: 999rem;

  /* Stable application aliases derived from Framework values. */
  --background: var(--semantic-surface);
  --foreground: var(--semantic-text);
  --card: color-mix(in oklch, var(--semantic-surface) 97%, white);
  --card-foreground: var(--semantic-text);
  --muted: color-mix(in oklch, var(--semantic-text) 4%, var(--semantic-surface));
  --muted-foreground: color-mix(in oklch, var(--semantic-text) 62%, var(--semantic-surface));
  --primary: var(--semantic-action);
  --primary-foreground: var(--semantic-surface);
  --secondary: color-mix(in oklch, var(--semantic-text) 5%, var(--semantic-surface));
  --secondary-foreground: var(--semantic-text);
  --accent: color-mix(in oklch, var(--semantic-primary) 8%, var(--semantic-surface));
  --accent-foreground: var(--semantic-text);
  --border: color-mix(in oklch, var(--semantic-border) 46%, var(--semantic-surface));
  --input: var(--border);
  --ring: var(--semantic-focus);

  --sidebar: var(--card);
  --sidebar-foreground: var(--semantic-text);
  --sidebar-muted: var(--muted-foreground);
  --sidebar-border: var(--border);
  --sidebar-active: var(--accent);
  --sidebar-badge: color-mix(in oklch, var(--semantic-action) 14%, var(--semantic-surface));
  --sidebar-badge-foreground: var(--semantic-primary);

  /* Compatibility names retained while existing app chrome migrates. */
  --font-sans: var(--font-body);
  --font-mono: var(--font-code);
  --space-1: var(--space-4xs);
  --space-2: var(--space-3xs);
  --space-3: var(--space-xs);
  --space-4: var(--space-m);
  --space-5: calc((var(--space-m) + var(--space-l)) / 2);
  --space-6: var(--space-l);
  --radius-sm: var(--radius-s);
  --radius-md: var(--radius-m);
}

.btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: var(--space-3xs);
	min-block-size: var(--btn-min-block-size, 2.75rem);
	border-width: 1px;
	border-style: solid;
	border-color: var(--btn-border-color, var(--btn-background, var(--semantic-action)));
	border-radius: var(--btn-radius, var(--radius-m));
	padding: var(--btn-padding-block, var(--space-3xs)) var(--btn-padding-inline, var(--space-s));
	background: var(--btn-background, var(--semantic-action));
	color: var(--btn-text-color, var(--semantic-surface));
	font-weight: var(--btn-font-weight, 650);
	font-size: var(--btn-font-size, var(--text-m));
	line-height: 1.2;
	font-family: var(--font-body);
	text-decoration: none;
	cursor: pointer;
	transition: background-color 180ms ease, border-color 180ms ease, color 180ms ease, transform 180ms ease;

	&:hover {
		background: color-mix(in oklch, var(--btn-background, var(--semantic-action)) 88%, var(--semantic-text));
		transform: translateY(-.1rem);
	}
	
	&:focus-visible {
		outline: 3px solid var(--semantic-focus);
		outline-offset: 2px;
	}
	
	&[data-variant="secondary"] {
		--btn-background: var(--semantic-surface);
		--btn-border-color: var(--semantic-border);
		--btn-text-color: var(--semantic-text);
	}
	
	&[data-variant="ghost"] {
		--btn-background: transparent;
		--btn-border-color: transparent;
		--btn-text-color: var(--semantic-action);
	}
	
	&[data-size="small"] {
		--btn-min-block-size: 2.25rem;
		--btn-padding-block: var(--space-4xs);
		--btn-padding-inline: var(--space-xs);
		--btn-font-size: var(--text-s);
	}
	
	&[data-size="large"] {
		--btn-min-block-size: 3.25rem;
		--btn-padding-block: var(--space-xs);
		--btn-padding-inline: var(--space-m);
		--btn-font-size: var(--text-l);
	}
	
	@media (prefers-reduced-motion: reduce) {
		& {
			transition: none;
		}
	}
}
body { margin: 0; background: var(--semantic-surface); }
.review-portrait-strip-hero {
	--portrait-strip-hero-space: var(--space-4xl);
	--portrait-strip-hero-background: color-mix(in oklch, var(--semantic-action) 7%, var(--semantic-surface));
	--portrait-strip-hero-color: var(--semantic-text);
	display: grid;
	gap: var(--portrait-strip-hero-space);
	padding: clamp(var(--space-xl), 7%, var(--space-4xl)) var(--space-l) var(--space-l);
	background: var(--portrait-strip-hero-background);
	color: var(--portrait-strip-hero-color);
	container: review-portrait-strip-hero/inline-size;
	font-family: var(--font-body);
	box-sizing: border-box;
	inline-size: 100%;
	& * {
		box-sizing: border-box;
	}
	&[data-tone="quiet"] {
		--portrait-strip-hero-background: var(--semantic-surface);
	}
	& .review-portrait-strip-hero__intro {
		display: grid;
		grid-template-columns: minmax(0, 1.3fr) minmax(14rem, .7fr);
		gap: var(--space-xl);
		max-inline-size: 68rem;
		inline-size: 100%;
		justify-self: center;
	}
	& p {
		margin: 0;
		font: 400 var(--text-s)/1.5 var(--font-body);
	}
	& h2 {
		grid-column: 1;
		margin: 0;
		max-inline-size: 13ch;
		font: 400 clamp(var(--text-2xl), 6cqi, var(--text-4xl))/ .92 var(--font-heading);
		letter-spacing: -.06em;
	}
	& .review-portrait-strip-hero__intro > div {
		display: grid;
		align-content: end;
		gap: var(--space-m);
	}
	& .review-portrait-strip-hero__action {
		--btn-radius: var(--radius-full);
		--btn-background: var(--semantic-text);
		--btn-border-color: var(--semantic-text);
		--btn-text-color: var(--semantic-surface);
		inline-size: max-content;
	}
	& .review-portrait-strip-hero__strip {
		display: flex;
		gap: var(--space-s);
		min-inline-size: 0;
		margin: 0;
		padding: var(--space-s) 0 var(--space-2xl);
		overflow: clip;
		list-style: none;
	}
	& .review-portrait-strip-hero__strip li {
		flex: 1 0 6rem;
		min-inline-size: 0;
		aspect-ratio: 3 / 4;
		overflow: hidden;
		border: 1px solid var(--semantic-border);
		border-radius: var(--radius-full);
		transition: translate .2s ease;
	}
	& .review-portrait-strip-hero__strip li:nth-child(even) {
		translate: 0 var(--space-l);
	}
	& .review-portrait-strip-hero__strip li:hover {
		translate: 0 calc(var(--space-s) * -1);
	}
	& img {
		display: block;
		inline-size: 100%;
		block-size: 100%;
		object-fit: cover;
	}
	@container review-portrait-strip-hero (max-width:40rem) {
		& .review-portrait-strip-hero__intro {
			grid-template-columns: 1fr;
		}
		& h2 {
			grid-column: auto;
		}
	}
	@media (prefers-reduced-motion:reduce) {
		& .review-portrait-strip-hero__strip li {
			transition: none;
		}
	}
}

@media (prefers-reduced-motion:no-preference) {
	.review-portrait-strip-hero .review-portrait-strip-hero__strip li {
		animation: review-portrait-strip-hero--enter .7s ease both;
	}
	.review-portrait-strip-hero .review-portrait-strip-hero__strip li:nth-child(even) {
		animation-delay: .1s;
	}
}

@keyframes review-portrait-strip-hero--enter {
	from {
		opacity: 0;
		translate: 0 var(--space-xl);
	}
}</style><body><section class="review-portrait-strip-hero" aria-labelledby="portrait-strip-hero-title" data-tone="warm">

	<ul class="review-portrait-strip-hero__strip" aria-label="Portraits of creative team members">

		<li><img src="https://images.pexels.com/photos/614810/pexels-photo-614810.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=480" alt="" width="480" height="640"></li>
		<li><img src="https://images.pexels.com/photos/733872/pexels-photo-733872.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=480" alt="" width="480" height="640"></li>

	</ul>
</section></body></html>
