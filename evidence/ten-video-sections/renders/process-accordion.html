<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Process accordion — portable verification</title><style>:root {
  color-scheme: light;

  /* Techies Starter Framework: color Primitives and Semantic Roles. */
  --color-primary-lightest: oklch(98.9% 0.003 275.8);
  --color-primary-lighter: oklch(95.4% 0.019 275.5);
  --color-primary-light: oklch(88.3% 0.048 274.7);
  --color-primary: #2563eb;
  --color-primary-dark: oklch(40.4% 0.158 262.9);
  --color-primary-darker: oklch(27.3% 0.107 262.9);
  --color-primary-darkest: oklch(15.3% 0.06 262.9);

  --semantic-primary: var(--color-primary);
  --semantic-action: var(--color-primary);
  --semantic-surface: var(--color-primary-lightest);
  --semantic-text: #111827;
  --semantic-border: var(--color-primary-light);
  --semantic-focus: var(--color-primary);

  /* Techies Starter Framework: typography Primitives. */
  --font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-heading: var(--font-body);
  --font-code: "Roboto Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  --text-xs: 0.7901rem;
  --text-s: 0.8889rem;
  --text-m: 1rem;
  --text-l: 1.5rem;
  --text-xl: 1.999rem;
  --text-2xl: 2.6647rem;
  --text-3xl: 3.552rem;
  --text-4xl: 4.7348rem;

  /* Techies Starter Framework: spacing and radius Primitives. */
  --space-4xs: 0.25rem;
  --space-3xs: 0.5rem;
  --space-2xs: 0.625rem;
  --space-xs: 0.75rem;
  --space-s: 0.875rem;
  --space-m: 1rem;
  --space-l: 1.5rem;
  --space-xl: 2rem;
  --space-2xl: 3rem;
  --space-3xl: 4rem;
  --space-4xl: 6rem;

  --radius-xs: 0.125rem;
  --radius-s: 0.25rem;
  --radius-m: 0.5rem;
  --radius-l: 0.75rem;
  --radius-xl: 1rem;
  --radius-full: 999rem;

  /* Stable application aliases derived from Framework values. */
  --background: var(--semantic-surface);
  --foreground: var(--semantic-text);
  --card: color-mix(in oklch, var(--semantic-surface) 97%, white);
  --card-foreground: var(--semantic-text);
  --muted: color-mix(in oklch, var(--semantic-text) 4%, var(--semantic-surface));
  --muted-foreground: color-mix(in oklch, var(--semantic-text) 62%, var(--semantic-surface));
  --primary: var(--semantic-action);
  --primary-foreground: var(--semantic-surface);
  --secondary: color-mix(in oklch, var(--semantic-text) 5%, var(--semantic-surface));
  --secondary-foreground: var(--semantic-text);
  --accent: color-mix(in oklch, var(--semantic-primary) 8%, var(--semantic-surface));
  --accent-foreground: var(--semantic-text);
  --border: color-mix(in oklch, var(--semantic-border) 46%, var(--semantic-surface));
  --input: var(--border);
  --ring: var(--semantic-focus);

  --sidebar: var(--card);
  --sidebar-foreground: var(--semantic-text);
  --sidebar-muted: var(--muted-foreground);
  --sidebar-border: var(--border);
  --sidebar-active: var(--accent);
  --sidebar-badge: color-mix(in oklch, var(--semantic-action) 14%, var(--semantic-surface));
  --sidebar-badge-foreground: var(--semantic-primary);

  /* Compatibility names retained while existing app chrome migrates. */
  --font-sans: var(--font-body);
  --font-mono: var(--font-code);
  --space-1: var(--space-4xs);
  --space-2: var(--space-3xs);
  --space-3: var(--space-xs);
  --space-4: var(--space-m);
  --space-5: calc((var(--space-m) + var(--space-l)) / 2);
  --space-6: var(--space-l);
  --radius-sm: var(--radius-s);
  --radius-md: var(--radius-m);
}

.btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: var(--space-3xs);
	min-block-size: var(--btn-min-block-size, 2.75rem);
	border-width: 1px;
	border-style: solid;
	border-color: var(--btn-border-color, var(--btn-background, var(--semantic-action)));
	border-radius: var(--btn-radius, var(--radius-m));
	padding: var(--btn-padding-block, var(--space-3xs)) var(--btn-padding-inline, var(--space-s));
	background: var(--btn-background, var(--semantic-action));
	color: var(--btn-text-color, var(--semantic-surface));
	font-weight: var(--btn-font-weight, 650);
	font-size: var(--btn-font-size, var(--text-m));
	line-height: 1.2;
	font-family: var(--font-body);
	text-decoration: none;
	cursor: pointer;
	transition: background-color 180ms ease, border-color 180ms ease, color 180ms ease, transform 180ms ease;

	&:hover {
		background: color-mix(in oklch, var(--btn-background, var(--semantic-action)) 88%, var(--semantic-text));
		transform: translateY(-.1rem);
	}
	
	&:focus-visible {
		outline: 3px solid var(--semantic-focus);
		outline-offset: 2px;
	}
	
	&[data-variant="secondary"] {
		--btn-background: var(--semantic-surface);
		--btn-border-color: var(--semantic-border);
		--btn-text-color: var(--semantic-text);
	}
	
	&[data-variant="ghost"] {
		--btn-background: transparent;
		--btn-border-color: transparent;
		--btn-text-color: var(--semantic-action);
	}
	
	&[data-size="small"] {
		--btn-min-block-size: 2.25rem;
		--btn-padding-block: var(--space-4xs);
		--btn-padding-inline: var(--space-xs);
		--btn-font-size: var(--text-s);
	}
	
	&[data-size="large"] {
		--btn-min-block-size: 3.25rem;
		--btn-padding-block: var(--space-xs);
		--btn-padding-inline: var(--space-m);
		--btn-font-size: var(--text-l);
	}
	
	@media (prefers-reduced-motion: reduce) {
		& {
			transition: none;
		}
	}
}
body { margin: 0; background: var(--semantic-surface); }
.review-process-accordion {
	--process-accordion-radius: var(--radius-l);
	padding: clamp(var(--space-xl), 7%, var(--space-4xl));
	background: var(--semantic-text);
	color: var(--semantic-surface);
	font-family: var(--font-body);
	container: review-process-accordion/inline-size;
	box-sizing: border-box;
	inline-size: 100%;
	& * {
		box-sizing: border-box;
	}
	& .review-process-accordion__layout {
		display: grid;
		grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr);
		gap: var(--space-3xl);
	}
	& header {
		align-self: start;
		position: sticky;
		inset-block-start: var(--space-l);
	}
	& p {
		margin: 0;
		font: 400 var(--text-s)/1.5 var(--font-body);
	}
	& h2 {
		margin: var(--space-s) 0;
		font: 400 clamp(var(--text-2xl), 5cqi, var(--text-4xl))/.94 var(--font-heading);
		letter-spacing: -.05em;
	}
	& .review-process-accordion__steps {
		display: grid;
		gap: var(--space-s);
		min-inline-size: 0;
	}
	& details {
		padding: var(--space-l);
		border-radius: var(--process-accordion-radius);
		background: var(--semantic-surface);
		color: var(--semantic-text);
	}
	& details:nth-child(1) {
		background: color-mix(in oklch, var(--semantic-action) 26%, var(--semantic-surface));
	}
	& details:nth-child(2) {
		background: color-mix(in oklch, var(--semantic-focus) 12%, var(--semantic-surface));
	}
	& details:nth-child(4) {
		background: color-mix(in oklch, var(--semantic-action) 38%, var(--semantic-surface));
	}
	& summary {
		display: flex;
		align-items: center;
		gap: var(--space-m);
		cursor: pointer;
		font: 400 var(--text-xl)/1.15 var(--font-heading);
	}
	& summary::after {
		content: "+";
		margin-inline-start: auto;
		font: 300 var(--text-xl)/1 var(--font-body);
	}
	& details[open] summary::after {
		content: "−";
	}
	& summary:focus-visible {
		outline: 3px solid var(--semantic-focus);
		outline-offset: 6px;
	}
	& summary b {
		font: 400 var(--text-xs)/1 var(--font-code);
	}
	& details p {
		border-block-start: 1px solid color-mix(in oklch, var(--semantic-text) 25%, transparent);
		padding-block-start: var(--space-s);
		max-inline-size: 42ch;
	}
	& .review-process-accordion__drawing {
		position: relative;
		block-size: 6rem;
		margin-block: var(--space-l);
	}
	& i {
		position: absolute;
		inset-block-start: var(--space-m);
		inline-size: 3.5rem;
		block-size: 3.5rem;
		border: 1px solid currentColor;
		border-radius: 50%;
		opacity: .6;
	}
	& i:nth-child(2) {
		translate: 1.8rem 0;
	}
	& i:nth-child(3) {
		translate: .9rem 1.5rem;
	}
	& details:nth-child(2) i {
		inline-size: 2.5rem;
		block-size: 2.5rem;
	}
	& details:nth-child(2) i:nth-child(2) {
		translate: 0 1rem;
	}
	& details:nth-child(2) i:nth-child(3) {
		translate: 0 2rem;
	}
	& details:nth-child(3) i {
		border-radius: 0;
		rotate: 45deg;
		scale: .75;
	}
	& details:nth-child(3) i:nth-child(2) {
		translate: 0 .8rem;
	}
	& details:nth-child(3) i:nth-child(3) {
		translate: 0 1.6rem;
	}
	& details:nth-child(4) i {
		border-radius: 0;
		inline-size: 4rem;
		block-size: 1.6rem;
		transform: skewY(-24deg);
	}
}

@container review-process-accordion (max-width:40rem) {
	.review-process-accordion .review-process-accordion__layout {
		grid-template-columns: 1fr;
		gap: var(--space-xl);
	}
	.review-process-accordion header {
		position: static;
	}
}

@media (prefers-reduced-motion:no-preference) {
	.review-process-accordion details[open] .review-process-accordion__drawing {
		animation: review-process-accordion--draw .35s ease both;
	}
}

@keyframes review-process-accordion--draw {
	from {
		opacity: 0;
		translate: 0 .5rem;
	}
}</style><body><section class="review-process-accordion" aria-labelledby="process-accordion-title">
	<div class="review-process-accordion__layout">

		<div class="review-process-accordion__steps">

				<summary><b>01</b> Listen</summary>

			</details>
			<details>

			</details>
			<details>
				<summary><b>03</b> Build</summary>
				<div class="review-process-accordion__drawing" aria-hidden="true"><i></i><i></i><i></i></div>

			</details>
			<details>
				<summary><b>04</b> Ship</summary>
				<div class="review-process-accordion__drawing" aria-hidden="true"><i></i><i></i><i></i></div>

			</details>
		</div>
	</div>
</section></body></html>
