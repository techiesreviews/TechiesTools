<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Editorial image panels — portable verification</title><style>:root {
  color-scheme: light;

  /* Techies Starter Framework: color Primitives and Semantic Roles. */
  --color-primary-lightest: oklch(98.9% 0.003 275.8);
  --color-primary-lighter: oklch(95.4% 0.019 275.5);
  --color-primary-light: oklch(88.3% 0.048 274.7);
  --color-primary: #2563eb;
  --color-primary-dark: oklch(40.4% 0.158 262.9);
  --color-primary-darker: oklch(27.3% 0.107 262.9);
  --color-primary-darkest: oklch(15.3% 0.06 262.9);

  --semantic-primary: var(--color-primary);
  --semantic-action: var(--color-primary);
  --semantic-surface: var(--color-primary-lightest);
  --semantic-text: #111827;
  --semantic-border: var(--color-primary-light);
  --semantic-focus: var(--color-primary);

  /* Techies Starter Framework: typography Primitives. */
  --font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-heading: var(--font-body);
  --font-code: "Roboto Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  --text-xs: 0.7901rem;
  --text-s: 0.8889rem;
  --text-m: 1rem;
  --text-l: 1.5rem;
  --text-xl: 1.999rem;
  --text-2xl: 2.6647rem;
  --text-3xl: 3.552rem;
  --text-4xl: 4.7348rem;

  /* Techies Starter Framework: spacing and radius Primitives. */
  --space-4xs: 0.25rem;
  --space-3xs: 0.5rem;
  --space-2xs: 0.625rem;
  --space-xs: 0.75rem;
  --space-s: 0.875rem;
  --space-m: 1rem;
  --space-l: 1.5rem;
  --space-xl: 2rem;
  --space-2xl: 3rem;
  --space-3xl: 4rem;
  --space-4xl: 6rem;

  --radius-xs: 0.125rem;
  --radius-s: 0.25rem;
  --radius-m: 0.5rem;
  --radius-l: 0.75rem;
  --radius-xl: 1rem;
  --radius-full: 999rem;

  /* Stable application aliases derived from Framework values. */
  --background: var(--semantic-surface);
  --foreground: var(--semantic-text);
  --card: color-mix(in oklch, var(--semantic-surface) 97%, white);
  --card-foreground: var(--semantic-text);
  --muted: color-mix(in oklch, var(--semantic-text) 4%, var(--semantic-surface));
  --muted-foreground: color-mix(in oklch, var(--semantic-text) 62%, var(--semantic-surface));
  --primary: var(--semantic-action);
  --primary-foreground: var(--semantic-surface);
  --secondary: color-mix(in oklch, var(--semantic-text) 5%, var(--semantic-surface));
  --secondary-foreground: var(--semantic-text);
  --accent: color-mix(in oklch, var(--semantic-primary) 8%, var(--semantic-surface));
  --accent-foreground: var(--semantic-text);
  --border: color-mix(in oklch, var(--semantic-border) 46%, var(--semantic-surface));
  --input: var(--border);
  --ring: var(--semantic-focus);

  --sidebar: var(--card);
  --sidebar-foreground: var(--semantic-text);
  --sidebar-muted: var(--muted-foreground);
  --sidebar-border: var(--border);
  --sidebar-active: var(--accent);
  --sidebar-badge: color-mix(in oklch, var(--semantic-action) 14%, var(--semantic-surface));
  --sidebar-badge-foreground: var(--semantic-primary);

  /* Compatibility names retained while existing app chrome migrates. */
  --font-sans: var(--font-body);
  --font-mono: var(--font-code);
  --space-1: var(--space-4xs);
  --space-2: var(--space-3xs);
  --space-3: var(--space-xs);
  --space-4: var(--space-m);
  --space-5: calc((var(--space-m) + var(--space-l)) / 2);
  --space-6: var(--space-l);
  --radius-sm: var(--radius-s);
  --radius-md: var(--radius-m);
}

.btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: var(--space-3xs);
	min-block-size: var(--btn-min-block-size, 2.75rem);
	border-width: 1px;
	border-style: solid;
	border-color: var(--btn-border-color, var(--btn-background, var(--semantic-action)));
	border-radius: var(--btn-radius, var(--radius-m));
	padding: var(--btn-padding-block, var(--space-3xs)) var(--btn-padding-inline, var(--space-s));
	background: var(--btn-background, var(--semantic-action));
	color: var(--btn-text-color, var(--semantic-surface));
	font-weight: var(--btn-font-weight, 650);
	font-size: var(--btn-font-size, var(--text-m));
	line-height: 1.2;
	font-family: var(--font-body);
	text-decoration: none;
	cursor: pointer;
	transition: background-color 180ms ease, border-color 180ms ease, color 180ms ease, transform 180ms ease;

	&:hover {
		background: color-mix(in oklch, var(--btn-background, var(--semantic-action)) 88%, var(--semantic-text));
		transform: translateY(-.1rem);
	}
	
	&:focus-visible {
		outline: 3px solid var(--semantic-focus);
		outline-offset: 2px;
	}
	
	&[data-variant="secondary"] {
		--btn-background: var(--semantic-surface);
		--btn-border-color: var(--semantic-border);
		--btn-text-color: var(--semantic-text);
	}
	
	&[data-variant="ghost"] {
		--btn-background: transparent;
		--btn-border-color: transparent;
		--btn-text-color: var(--semantic-action);
	}
	
	&[data-size="small"] {
		--btn-min-block-size: 2.25rem;
		--btn-padding-block: var(--space-4xs);
		--btn-padding-inline: var(--space-xs);
		--btn-font-size: var(--text-s);
	}
	
	&[data-size="large"] {
		--btn-min-block-size: 3.25rem;
		--btn-padding-block: var(--space-xs);
		--btn-padding-inline: var(--space-m);
		--btn-font-size: var(--text-l);
	}
	
	@media (prefers-reduced-motion: reduce) {
		& {
			transition: none;
		}
	}
}
body { margin: 0; background: var(--semantic-surface); }
.review-editorial-image-panels {
	box-sizing: border-box;
	inline-size: 100%;
	--editorial-image-panels-radius: var(--radius-l);
	position: relative;
	display: grid;
	gap: 0;
	background: var(--semantic-text);
	color: var(--semantic-surface);
	container: review-editorial-image-panels/inline-size;
	font-family: var(--font-body);
	inline-size: 100%;
	& * {
		box-sizing: border-box;
	}
	& header {
		position: absolute;
		inset-block-start: 0;
		z-index: 2;
		padding: clamp(var(--space-l), 4cqi, var(--space-3xl));
		pointer-events: none;
	}
	& header p {
		margin: 0;
		font: 400 var(--text-s)/1.4 var(--font-body);
	}
	& h2 {
		margin: var(--space-s) 0;
		max-inline-size: 14ch;
		font: 400 var(--text-2xl)/.95 var(--font-heading);
		letter-spacing: -.04em;
	}
	& article {
		position: relative;
		block-size: clamp(36rem, 100svh, 64rem);
		overflow: clip;
		border-radius: var(--editorial-image-panels-radius);
		isolation: isolate;
	}
	&[data-density="compact"] article {
		block-size: clamp(30rem, 75svh, 48rem);
	}
	& img {
		position: absolute;
		inset: 0;
		inline-size: 100%;
		block-size: 100%;
		object-fit: cover;
		object-position: 50% 65%;
	}
	& article::after {
		position: absolute;
		inset: 0;
		z-index: 0;
		content: "";
		background: linear-gradient(180deg, color-mix(in oklch, var(--semantic-text) 68%, transparent), color-mix(in oklch, var(--semantic-text) 30%, transparent) 48%, color-mix(in oklch, var(--semantic-text) 75%, transparent));
	}
	& article p, & h3 {
		position: absolute;
		z-index: 1;
		margin: 0;
	}
	& article p {
		inset: 55% auto auto 50%;
		translate: -50% -50%;
		color: var(--semantic-surface);
		font: 400 clamp(var(--text-4xl), 15cqi, 12rem)/.85 var(--font-heading);
		letter-spacing: -.07em;
	}
	& article p::before, & article p::after {
		position: absolute;
		inset-inline: 0;
		text-align: center;
		color: transparent;
		-webkit-text-stroke: 1px var(--semantic-surface);
		opacity: .55;
	}
	& article p::before {
		content: attr(data-previous);
		inset-block-end: 125%;
	}
	& article p::after {
		content: attr(data-next);
		inset-block-start: 125%;
	}
	& h3 {
		inset: auto var(--space-xl) var(--space-xl);
		font: 400 var(--text-xl)/1 var(--font-heading);
	}
}

@supports (animation-timeline:view()) {
	@media (prefers-reduced-motion:no-preference) {
		.review-editorial-image-panels img {
			animation: review-editorial-image-panels--drift linear both;
			animation-timeline: view();
		}
		.review-editorial-image-panels article p {
			animation: review-editorial-image-panels--ink linear both;
			animation-timeline: view();
		}
	}
}

@keyframes review-editorial-image-panels--drift {
	from {
		transform: scale(1.12) translateY(4%);
	}
	to {
		transform: scale(1.12) translateY(-4%);
	}
}

@keyframes review-editorial-image-panels--ink {
	0%,100% {
		color: transparent;
		-webkit-text-stroke: 1px var(--semantic-surface);
	}
	35%,65% {
		color: var(--semantic-surface);
		-webkit-text-stroke: 1px var(--semantic-surface);
	}
}</style><body><section class="review-editorial-image-panels" aria-labelledby="editorial-image-panels-title" data-density="open">
	<header>
		<p>A considered setup</p>
		<h2 id="editorial-image-panels-title">Let the space shape the work.</h2>
	</header>
	<article><img src="https://images.pexels.com/photos/6483591/pexels-photo-6483591.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1600" alt="Desktop computer against a muted green wall" width="1600" height="2400">
		<p aria-hidden="true" data-previous="" data-next="TWO">ONE</p>
		<h3>Set the pace.</h3>
	</article>
	<article><img loading="lazy" src="https://images.pexels.com/photos/8038334/pexels-photo-8038334.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1600" alt="Silver headphones on a stand against a soft mauve wall" width="1600" height="2400">
		<p aria-hidden="true" data-previous="ONE" data-next="THREE">TWO</p>
		<h3>Notice the details.</h3>
	</article>
	<article><img loading="lazy" src="https://images.pexels.com/photos/8003998/pexels-photo-8003998.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1600" alt="Airy workspace with a laptop, brass lamp, and trailing plant" width="1600" height="2400">
		<p aria-hidden="true" data-previous="TWO" data-next="">THREE</p>
		<h3>Leave space for thought.</h3>
	</article>
</section></body></html>
